<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Loyi: your digital loyalty cards.">
  <meta name="theme-color" content="#F7F5F2">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Loyi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Loyi</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown while Flutter loads (first visit after a tag tap). Loyi house style. */
    html, body { margin: 0; height: 100%; background: #F7F5F2; font-family: "Plus Jakarta Sans", -apple-system, system-ui, sans-serif; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; color: #17161C; }
    #loader .logo { font-size: 48px; font-weight: 800; letter-spacing: -2px; }
    #loader .logo span { color: #FF5A3C; }
    #loader .dots span { display: inline-block; width: 10px; height: 10px; margin: 0 4px; border-radius: 50%; background: #FF5A3C; animation: pulse 1s infinite ease-in-out; }
    #loader .dots span:nth-child(2) { animation-delay: .15s; background: #FFC83D; }
    #loader .dots span:nth-child(3) { animation-delay: .3s; background: #1FB57A; }
    @keyframes pulse { 0%, 100% { opacity: .3; transform: scale(.75); } 50% { opacity: 1; transform: scale(1); } }
    @media (prefers-color-scheme: dark) { html, body { background: #111015; } #loader { color: #F5F3EF; } }
    @media (prefers-reduced-motion: reduce) { #loader .dots span { animation: none; opacity: 1; } }
  </style>
</head>
<body>
  <div id="loader" aria-live="polite">
    <div class="logo">loyi<span>.</span></div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
